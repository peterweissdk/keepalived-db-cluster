# Name of the workflow as it appears in the GitHub Actions tab
name: MegaLinter

on:
  # Runs whenever code is pushed to the 'main' branch
  push:
    branches:
      - main
  # Runs on any Pull Request targeting the 'main' branch
  pull_request:
    branches:
      - main

jobs:
  megalinter:
    name: MegaLinter
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      statuses: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: MegaLinter
        id: ml
        uses: oxsecurity/megalinter@v10
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: main
          VALIDATE_ALL_CODEBASE: "${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}"
